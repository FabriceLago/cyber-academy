# Intégration continue : à chaque envoi sur la branche principale et à chaque demande de fusion.
# Aucun secret n'est nécessaire : la base est une pile Supabase locale, créée pour la durée du test.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, tests unitaires, build, secrets, dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  base-et-parcours:
    name: Base de données (pgTAP) et parcours utilisateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-playwright
          path: test-results/
          retention-days: 7
