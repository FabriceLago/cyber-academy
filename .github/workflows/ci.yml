# Intégration continue : à chaque envoi sur la branche principale et à chaque demande de fusion.
# Aucun secret n'est nécessaire : la base est une pile Supabase locale, créée pour la durée du test.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, tests unitaires, build, secrets, dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par empreinte de commit : une étiquette (v4) peut être déplacée vers un
      # code malveillant si le dépôt de l'action est compromis.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts : aucune dépendance n'exécute de code à l'installation.
      - run: npm ci --ignore-scripts
      - run: npm run verify

  base-et-parcours:
    name: Base de données (pgTAP) et parcours utilisateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:start
      - run: npm run db:test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultats-playwright
          path: test-results/
          retention-days: 7
